<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Abacus Trail | Kids Zone</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Fredoka:wght@400;600;700&family=Orbitron:wght@700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* ---------- THEME TOKENS ---------- */
    :root {
      --primary: #059669;
      --bg: #ecfdf5;
      --text: #052e1c;
      --muted: #475569;
      --prog: #10b981;
      --accent: #f59e0b;
      --card: #ffffff;
      --danger: #ef4444;
      --ok: #16a34a;
      --shadow: 0 10px 25px rgba(0, 0, 0, .08);
      --radius: 20px;
    }

    .theme-blue {
      --primary: #2563eb;
      --bg: #eff6ff;
      --text: #0b1220;
      --prog: #22c55e;
      --accent: #f59e0b;
      --card: #fff;
    }

    .theme-pink {
      --primary: #ec4899;
      --bg: #fdf2f8;
      --text: #831843;
      --prog: #db2777;
      --accent: #fbbf24;
      --card: #fff;
    }

    .theme-space {
      --primary: #7c3aed;
      --bg: #0b1020;
      --text: #e5e7eb;
      --prog: #22d3ee;
      --accent: #fbbf24;
      --card: #141a2a;
    }

    .theme-jungle {
      --primary: #059669;
      --bg: #ecfdf5;
      --text: #052e1c;
      --prog: #10b981;
      --accent: #f59e0b;
      --card: #fff;
    }

    .theme-ocean {
      --primary: #0ea5e9;
      --bg: #e0f2fe;
      --text: #06243b;
      --prog: #22c55e;
      --accent: #f97316;
      --card: #fff;
    }

    .theme-candy {
      --primary: #f43f5e;
      --bg: #fff1f2;
      --text: #7f1d1d;
      --prog: #34d399;
      --accent: #fb7185;
      --card: #fff;
    }

    .high-contrast {
      --bg: #000;
      --text: #fff;
      --card: #000;
      --primary: #ffd000;
      --accent: #00ffff;
      --prog: #00ff66;
      --muted: #bbb;
      --shadow: none;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', 'Fredoka', system-ui, sans-serif;
      transition: background .3s, color .3s;
    }

    /* ── HEADER ── */
    header {
      background: var(--card);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 4px solid rgba(0, 0, 0, .05);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1rem;
    }

    #brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 800;
    }

    #brand .logo {
      width: 28px;
      height: 28px;
    }

    #brand h1 {
      font-size: 1.25rem;
      margin: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: .5rem;
      justify-self: end;
    }

    .icon-btn {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 999px;
      padding: .35rem .6rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    .icon-btn[aria-pressed="true"] {
      background: var(--primary);
      color: #fff;
    }

    select,
    input[type="number"] {
      font-family: inherit;
      font-weight: 700;
      color: var(--text);
      border-radius: 12px;
      border: 2px solid var(--primary);
      background: #fff;
      padding: .55rem .7rem;
      outline: none;
      font-size: 1rem;
    }

    /* ── LAYOUT ── */
    main {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(1000px, 96vw);
      background: var(--card);
      border: 3px solid var(--primary);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }

    .row-flex {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      margin: .75rem 0 1rem;
    }

    .main-btn {
      cursor: pointer;
      padding: .75rem 1.4rem;
      border-radius: 14px;
      border: 0;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-family: inherit;
      font-size: 1rem;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .15);
      transition: transform .1s, box-shadow .1s;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(0, 0, 0, .15);
    }

    .main-btn:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .15);
    }

    .trail-btn {
      cursor: pointer;
      padding: .65rem 1.1rem;
      border-radius: 25px;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-family: inherit;
      font-size: .95rem;
      transition: all .15s;
    }

    .trail-btn.active,
    .trail-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .trail-group {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin: .75rem 0;
    }

    .input-zone {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
      margin: 1rem 0;
      
    }

    .num-input {
      width: 130px;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      padding: .5rem .75rem;
      border-radius: 14px;
      border: 3px solid var(--primary);
      background: #fff;
      color: var(--text);
    }

    .op-badge {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--primary);
      border-radius: 12px;
      padding: .2rem .7rem;
      margin-top: 24px;
    }

    .fun-tip {
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: .6rem 1rem;
      font-weight: 700;
      font-size: .95rem;
      margin: .75rem 0;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    /* ══════════════════════════════════════════════
       VERTICAL ABACUS — image-faithful UI

       Structure per column (= one digit):
         ┌──────────────────┐
         │  [heaven bead]   │  ← top section (above centre bar)
         │  ══ centre bar ══│
         │  [earth bead 1]  │  ← bottom section (below centre bar)
         │  [earth bead 2]  │
         │  [earth bead 3]  │
         │  [earth bead 4]  │
         └──────────────────┘

       Active heaven bead  → slides DOWN  toward bar
       Active earth beads  → slide  UP    toward bar
    ══════════════════════════════════════════════ */

    .abacus-wrapper {
      border-radius: 20px;
      border: 3px solid var(--primary);
      background: color-mix(in srgb, var(--primary) 5%, white);
      padding: 1.25rem;
      text-align: center;
      overflow-x: auto;
    }

    /* Outer wooden frame — matches image's thick brown border */
    .abacus-frame {
      display: inline-flex;
      background: #c8894a;
      /* mid-wood fill */
      border: 12px solid #7a4520;
      /* dark outer rim */
      border-radius: 16px;
      padding: 10px 8px;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, .35),
        inset 0 3px 10px rgba(0, 0, 0, .2),
        inset 0 -3px 6px rgba(255, 220, 150, .25);
      gap: 6px;
    }

    /* Inner white/cream area per column */
    .col {
      width: 52px;
      height: 340px;
      position: relative;
      background: rgba(255, 255, 255, .18);
      border-radius: 6px;
    }

    /* Vertical rod — round dark stick */
    .rod {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 100%;
      background: linear-gradient(to right, #888, #444, #888);
      border-radius: 3px;
      box-shadow: 1px 0 3px rgba(0, 0, 0, .3);
      z-index: 1;
    }

    /* Horizontal centre bar — thick wooden beam */
    .centre-bar {
      position: absolute;
      top: 112px;
      left: -4px;
      right: -4px;
      /* slightly wider than column */
      height: 16px;
      background: linear-gradient(to bottom, #a0601a, #7a4520, #a0601a);
      box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
      z-index: 3;
    }

    /* ── BEAD (image style: plump oval, thick outline, pastel fill) ── */
    .bead {
      width: 78%;
      height: 32px;
      border-radius: 50%;
      /* oval */
      border: 3px solid rgba(0, 0, 0, .45);
      /* thick dark outline like the image */
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      box-shadow:
        inset -3px -4px 7px rgba(0, 0, 0, .18),
        inset 3px 3px 7px rgba(255, 255, 255, .55);
      transition: top .38s cubic-bezier(.25, 1, .5, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      color: transparent;
    }

    .bead.active {
      color: black;
    }

    /*
      Bead colours — each column cycles through the same palette as the image:
      green, orange, pink, blue   (repeating)
    */
    .c0 .bead,
    .c4 .bead,
    .c8 .bead {
      background: radial-gradient(circle at 38% 32%, #7ef5aa, #27ae60);
      border-color: #1a7a40;
    }

    .c1 .bead,
    .c5 .bead,
    .c9 .bead {
      background: radial-gradient(circle at 38% 32%, #ffc27a, #e67e22);
      border-color: #b05a0a;
    }

    .c2 .bead,
    .c6 .bead {
      background: radial-gradient(circle at 38% 32%, #f9a0cc, #e91e63);
      border-color: #a0104a;
    }

    .c3 .bead,
    .c7 .bead {
      background: radial-gradient(circle at 38% 32%, #7ec8f8, #3498db);
      border-color: #1565c0;
    }

    /*
      HEAVEN BEAD positions
        inactive : top:10px  (away from bar, near top)
        active   : top:80px  (toward bar, just above centre-bar at 112px minus bead height)
    */
    .bead.heaven {
      top: 10px;
    }

    .bead.heaven.active {
      top: 76px;
    }

    /*
      EARTH BEAD positions (bar at 112px, bar height 16px → earth zone starts at 128px)
      We show 4 earth beads. Gap between each = ~36px
        inactive: stacked below (away from bar)
        active  : stacked immediately below bar (toward bar)

      Inactive resting positions (beads touching each other from bottom):
        e4: top: 270px
        e3: top: 234px
        e2: top: 198px
        e1: top: 162px

      Active positions (stacked up against bar):
        e1: top: 130px  (just below bar)
        e2: top: 164px
        e3: top: 198px  (only moves if 3+ active)
        e4: top: 232px  (only moves if 4  active)

      We handle this via JS classes: active beads get position from top,
      giving the correct stacking effect.
    */
    .bead.e1 {
      top: 166px;
    }

    .bead.e1.active {
      top: 130px;
    }

    .bead.e2 {
      top: 202px;
    }

    .bead.e2.active {
      top: 164px;
    }

    .bead.e3 {
      top: 238px;
    }

    .bead.e3.active {
      top: 198px;
    }

    .bead.e4 {
      top: 274px;
    }

    .bead.e4.active {
      top: 232px;
    }

    /* Digit label below each column */
    .digit-label {
      position: absolute;
      bottom: -50px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Place value label above */
    .place-label {
      position: absolute;
      top: -22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 9px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Wrapper that adds room for labels above & below the frame */
    .abacus-outer {
      display: inline-block;
      padding: 26px 4px 32px;
    }

    /* ── STEP / RESULT ── */
    #step-display {
      font-size: 1.2rem;
      font-weight: 900;
      margin: .85rem 0 .3rem;
      min-height: 1.5em;
    }

    #result-display {
      font-size: 1.75rem;
      font-weight: 900;
      min-height: 2em;
      color: var(--primary);
    }

    .step-bar {
      display: flex;
      gap: .4rem;
      justify-content: center;
      margin: .5rem 0;
    }

    .step-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: background .3s;
    }

    .step-dot.done {
      background: var(--prog);
    }

    .step-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 12px;
      font-size: .95rem;
      color: var(--muted);
    }

    .footer-row {
      display: flex;
      gap: .75rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer-sep {
      opacity: .3;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 800;
    }

    .social-link:hover {
      text-decoration: underline;
    }

    .ficon {
      width: 18px;
      height: 18px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pop {
      0% {
        transform: scale(.6);
        opacity: 0
      }

      70% {
        transform: scale(1.1)
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    .pop {
      animation: pop .4s ease forwards;
    }

    @media(max-width:640px) {
      .col {
        width: 36px;
        height: 250px;
      }

      .bead {
        height: 24px;
        font-size: 9px;
      }

      .centre-bar {
        top: 82px;
        height: 13px;
      }

      .bead.heaven {
        top: 8px;
      }

      .bead.heaven.active {
        top: 55px;
      }

      .bead.e1 {
        top: 120px;
      }

      .bead.e1.active {
        top: 97px;
      }

      .bead.e2 {
        top: 148px;
      }

      .bead.e2.active {
        top: 123px;
      }

      .bead.e3 {
        top: 176px;
      }

      .bead.e3.active {
        top: 149px;
      }

      .bead.e4 {
        top: 204px;
      }

      .bead.e4.active {
        top: 175px;
      }

      .abacus-frame {
        gap: 3px;
        padding: 8px 5px;
      }
    }
  </style>
</head>

  </footer>

  <script>
    const PLACES = ['B', 'HM', 'TM', 'M', 'HT', 'TT', 'Th', 'H', 'T', 'O'];
    const PLACE_FULL = ['Billions', 'H-Mill', 'T-Mill', 'Millions', 'H-Thou', 'T-Thou', 'Thousands', 'Hundreds', 'Tens', 'Ones'];
    let mode = 'represent', isMuted = false;

    const tips = {
      represent: '💡 Type a number and watch the abacus beads snap into place!',
      add: '💡 Enter two numbers. The abacus shows the first, then adds the second!',
      sub: '💡 Enter two numbers. The abacus shows the first, then subtracts the second!'
    };

    /* ── Build DOM ── */
    function buildAbacus() {
      let html = '';
      for (let i = 0; i < 10; i++) {
        html += `
        <div class="col c${i}" id="c${i}">
          <div class="place-label">${PLACE_FULL[i]}</div>
          <div class="rod"></div>
          <div class="centre-bar"></div>
          <div class="bead heaven" id="c${i}h">5</div>
          <div class="bead e1"    id="c${i}e1">1</div>
          <div class="bead e2"    id="c${i}e2">1</div>
          <div class="bead e3"    id="c${i}e3">1</div>
          <div class="bead e4"    id="c${i}e4">1</div>
          <div class="digit-label" id="dl${i}">0</div>
        </div>`;
      }
      document.getElementById('abacus').innerHTML = html;
    }

    /* ── Update abacus display ── */
    function update(num) {
      const digits = Math.abs(Math.round(num)).toString().padStart(10, '0');
      digits.split('').forEach((d, i) => {
        let v = parseInt(d);
        // clear all
        ['h', 'e1', 'e2', 'e3', 'e4'].forEach(k => document.getElementById(`c${i}${k}`).classList.remove('active'));
        // heaven
        if (v >= 5) { document.getElementById(`c${i}h`).classList.add('active'); v -= 5; }
        // earth
        for (let e = 1; e <= v; e++) document.getElementById(`c${i}e${e}`).classList.add('active');
        // label
        document.getElementById(`dl${i}`).textContent = d;
      });
    }

    /* ── Trail logic ── */
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function startTrail() {
      const n1 = parseInt(document.getElementById('num1').value) || 0;
      const n2 = parseInt(document.getElementById('num2').value) || 0;
      const stepBar = document.getElementById('step-bar');
      const stepDisp = document.getElementById('step-display');
      const resultDisp = document.getElementById('result-display');
      resultDisp.className = ''; resultDisp.textContent = '';
      stepDisp.textContent = '';

      if (mode === 'represent') {
        stepBar.classList.add('hidden');
        update(n1);
        stepDisp.textContent = `Showing ${n1.toLocaleString()} on the abacus`;
        resultDisp.textContent = `${n1.toLocaleString()} 🎯`;
        resultDisp.classList.add('pop');
        beep('ok'); return;
      }

      stepBar.classList.remove('hidden');

      setDot(0); update(n1);
      stepDisp.textContent = `Step 1: Show ${n1.toLocaleString()} on the abacus`;
      beep('tick'); await sleep(1400);

      setDot(1);
      stepDisp.textContent = `Step 2: Now ${mode === 'add' ? 'adding' : 'subtracting'} ${n2.toLocaleString()}…`;
      beep('tick'); await sleep(900);

      setDot(2);
      const result = mode === 'add' ? n1 + n2 : n1 - n2;
      update(result);
      const sym = mode === 'add' ? '+' : '−';
      stepDisp.textContent = `Step 3: Done! 🎉`;
      resultDisp.textContent = `${n1.toLocaleString()} ${sym} ${n2.toLocaleString()} = ${result.toLocaleString()} 🎉`;
      resultDisp.classList.add('pop');
      beep('ok');
      confetti({ particleCount: 90, spread: 65, origin: { y: 0.6 } });
    }

    function setDot(idx) {
      document.querySelectorAll('.step-dot').forEach((d, i) => {
        d.className = 'step-dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
      });
    }

    /* ── Mode ── */
    function setMode(m, btn) {
      mode = m;
      document.querySelectorAll('.trail-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const n2w = document.getElementById('num2-wrap');
      const ob = document.getElementById('op-badge');
      if (m === 'represent') { n2w.classList.add('hidden'); ob.classList.add('hidden'); }
      else { n2w.classList.remove('hidden'); ob.classList.remove('hidden'); ob.textContent = m === 'add' ? '+' : '−'; }
      document.getElementById('mode-tip').textContent = tips[m];
      document.getElementById('step-bar').classList.add('hidden');
      document.getElementById('step-display').textContent = '';
      document.getElementById('result-display').textContent = '';
      update(0);
    }

    /* ── Theme / Sound / Contrast ── */
    document.getElementById('theme').addEventListener('change', e => { document.body.className = e.target.value; });

    function beep(type) {
      if (isMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = type === 'ok' ? 660 : 440;
        gain.gain.setValueAtTime(.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .25);
        osc.start(); osc.stop(ctx.currentTime + .25);
      } catch (e) { }
    }

    document.getElementById('sound-btn').addEventListener('click', e => {
      isMuted = !isMuted;
      e.currentTarget.setAttribute('aria-pressed', String(!isMuted));
      e.currentTarget.textContent = isMuted ? '🔇' : '🔊';
      if (!isMuted) beep('ok');
    });

    document.getElementById('contrast-btn').addEventListener('click', e => {
      const on = !document.body.classList.contains('high-contrast');
      document.body.classList.toggle('high-contrast', on);
      e.currentTarget.setAttribute('aria-pressed', String(on));
    });

    document.getElementById('help-btn').addEventListener('click', () => {
      alert(`🧮 Abacus Trail — How to Play

Each COLUMN = one digit place (Billions → Ones, left to right).

TOP bead   (1 bead)  = worth 5  → slides DOWN  toward the bar when active
BOTTOM beads (4 beads) = 1 each → slide  UP    toward the bar when active

Trails:
• Show Number  — enter any number up to 9,999,999,999
• Add Numbers  — animated step-by-step addition
• Subtract     — animated step-by-step subtraction

Press Enter to run the abacus.`);
    });

    document.addEventListener('keydown', e => { if (e.key === 'Enter') startTrail(); });

    buildAbacus();
    update(0);
  </script>
</body>

</html>
