<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Teal Gradient for 'Kids' -->
    <linearGradient id="kz-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55D5C6" />
      <stop offset="40%" stop-color="#42C8B7" />
      <stop offset="100%" stop-color="#34B7A7" />
    </linearGradient>

    <!-- Orange Gradient for 'Zone' -->
    <linearGradient id="kz-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA24A" />
      <stop offset="40%" stop-color="#FF8A34" />
      <stop offset="100%" stop-color="#F2771D" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="kz-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.07" />
    </filter>

    <!-- Puzzle Piece (centered at 0,0, radius ~32) -->
    <g id="puzzle-piece">
      <path d="M -24,-24
               L -8,-24
               C -8,-34 8,-34 8,-24
               L 24,-24
               L 24,-8
               C 34,-8 34,8 24,8
               L 24,24
               L 8,24
               C 8,14 -8,14 -8,24
               L -24,24
               L -24,8
               C -14,8 -14,-8 -24,-8
               Z" />
    </g>
  </defs>

  <!-- =======================================================
       1. CONFETTI & PLAYFUL SHAPES (BACKGROUND/PERIPHERY)
       ======================================================= -->
  <g id="confetti-shapes">
    <!-- Top-left yellow triangle -->
    <polygon points="168,188 198,150 198,188" fill="#FFB242" />
    <!-- Top-left magenta diamond -->
    <rect x="256" y="148" width="34" height="34" rx="8" fill="#F85283" transform="rotate(22 273 165)" />

    <!-- Left side -->
    <g transform="translate(74, 305) rotate(-18) scale(1.15)">
      <use href="#puzzle-piece" fill="#67D7C7" />
    </g>
    <circle cx="65" cy="368" r="14" fill="#60D8C8" />
    <polygon points="100,402 120,444 76,444" fill="#FA5E44" />
    <g transform="translate(72, 555) rotate(22) scale(1.2)">
      <use href="#puzzle-piece" fill="#816DB4" />
    </g>
    <circle cx="36" cy="638" r="14" fill="none" stroke="#F85283" stroke-width="6" />
    <polygon points="78,675 96,648 108,675" fill="#FFB242" />

    <!-- Top center -->
    <g transform="translate(470, 195) rotate(25) scale(1.2)">
      <use href="#puzzle-piece" fill="#FDB82C" />
    </g>
    <circle cx="546" cy="168" r="9" fill="#5ED4C5" />

    <!-- Top right -->
    <polygon points="730,192 755,166 760,194" fill="#FA5E44" />
    <rect x="800" y="158" width="30" height="24" rx="6" fill="#FDB82C" transform="rotate(-15 815 170)" />
    <circle cx="868" cy="265" r="16" fill="#60D8C8" />

    <!-- Right side -->
    <polygon points="950,280 962,300 938,300" fill="#FF8A34" />
    <rect x="930" y="368" width="28" height="28" rx="6" fill="#FF9E42" transform="rotate(18 944 382)" />
    <rect x="952" y="455" width="28" height="28" rx="6" fill="#FF8A34" transform="rotate(8 966 469)" />
    <g transform="translate(942, 532) rotate(-12) scale(1.15)">
      <use href="#puzzle-piece" fill="#C9BCE7" />
    </g>
    <polygon points="915,675 970,675 942,600" fill="#60D8C8" transform="rotate(12 942 637)" />
    <rect x="875" y="720" width="36" height="36" rx="6" fill="#F85283" transform="rotate(25 893 738)" />

    <!-- Bottom left -->
    <polygon points="82,746 122,746 102,720" fill="#60D8C8" />
    <circle cx="140" cy="730" r="7" fill="#60D8C8" />
    <circle cx="152" cy="775" r="8" fill="#F85283" />
  </g>

  <!-- =======================================================
       2. RAINBOW ARC (BURSTING BEHIND 'KIDS')
       ======================================================= -->
