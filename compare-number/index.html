<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Number Compare Trail — Compare Numbers (<, =, >) | Kids Zone</title>
  <link rel="icon" type="image/svg+xml" href="../common/logo.svg" />
  <link rel="apple-touch-icon" href="../common/logo.svg" />

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Common Design System & Audio -->
  <link rel="stylesheet" href="../common/common.css" />
  <script src="../common/audio.js"></script>
  <script src="../common/common.js"></script>

  <!-- Game Specific CSS & JS -->
  <link rel="stylesheet" href="compare-number.css" />
  <script src="compare-number.js" defer></script>
</head>

<body>
  <!-- Common Header Auto-Mounted -->
  <header data-kz-header="compare-number"></header>

  <main>
    <!-- Setup Screen -->
    <section id="setup-screen" class="card" aria-label="Setup">
      <h2 style="margin:0.2rem 0; font-size:1.6rem; font-weight:800;">Choose Your Number Trail 🚀</h2>

      <div class="row" style="margin-top:0.4rem">
        <strong>Number Types to Compare:</strong>
        <label><input type="checkbox" id="cb-whole" checked> Whole Numbers</label>
        <label><input type="checkbox" id="cb-decimal" checked> Decimals</label>
        <label><input type="checkbox" id="cb-sfrac" checked> Simple Fractions</label>
        <label><input type="checkbox" id="cb-cfrac" checked> Complex Fractions</label>
      </div>

      <div class="row" style="margin-top:0.4rem">
        <strong>Whole Range:</strong>
        <label>Min: <input type="number" id="whole-min" class="kz-select" value="1" min="0" max="99" style="width:75px"></label>
        <label>Max: <input type="number" id="whole-max" class="kz-select" value="20" min="2" max="100" style="width:75px"></label>
        <label style="margin-left:0.5rem">Decimal Places: <select id="dec-places" class="kz-select"><option value="1">1 (e.g. 3.4)</option><option value="2" selected>2 (e.g. 3.45)</option><option value="3">3 (e.g. 3.456)</option></select></label>
      </div>

      <div class="row" style="margin-top:0.4rem">
        <label><input type="checkbox" id="allow-equal" checked> <strong>Include equal pairs</strong></label>
        <label><input type="checkbox" id="show-numline" checked> <strong>Show number line aid</strong></label>
        <label><input type="checkbox" id="shuffle-opts" checked> <strong>Shuffle (&lt; &gt; =) buttons</strong></label>
      </div>

      <div class="row" style="margin-top:0.4rem">
        <label for="qty-num"><strong>Questions:</strong></label>
        <input type="number" id="qty-num" class="kz-select" min="5" max="50" value="15" style="width:110px">
      </div>

      <div class="row" style="margin-top:0.6rem">
        <strong>Mode:</strong>
        <button type="button" id="btn-practice" class="mode-btn" aria-pressed="true">😌 Practice</button>
        <button type="button" id="btn-test" class="mode-btn" aria-pressed="false" style="opacity:0.7">⏱️ Test (Timed)</button>

        <div id="timed-controls" class="row hidden" style="align-items:flex-start">
          <div class="row" style="gap:0.35rem">
            <label><input type="radio" name="tbtype" value="per-question" checked> Per question</label>
            <label><input type="radio" name="tbtype" value="total"> Total time</label>
          </div>
          <div id="perq-wrap" class="row">
            <label for="per-q-secs">Seconds per Q:</label>
            <input id="per-q-secs" class="kz-select" type="number" min="5" max="60" value="12" style="width:90px">
          </div>
          <div id="total-wrap" class="row hidden">
            <label for="total-secs">Total seconds:</label>
            <input id="total-secs" class="kz-select" type="number" min="30" max="1800" value="180" style="width:110px">
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="row" style="justify-content:flex-end">
        <button class="main-btn" id="start-btn" style="min-width:180px">START TRAIL 🏁</button>
      </div>
    </section>

    <!-- Quiz Screen -->
    <section id="quiz-screen" class="card hidden" aria-label="Quiz" aria-live="polite">
      <div id="quiz-info">
        <div class="streak" id="streak">Streak: 0 🔥</div>
        <div id="timer-clock" aria-live="assertive"></div>
        <div id="q-progress" style="justify-self:end">Question 1/15</div>
      </div>

      <div id="question-wrap">
        <div id="message"></div>

        <div class="compare-arena" id="compare-arena">
          <div class="num-box" id="left-box">
            <div class="type-label" id="left-label">Whole Number</div>
            <div class="num-val" id="left-val">5</div>
          </div>

          <div class="symbol-slot" id="symbol-slot">?</div>

          <div class="num-box" id="right-box">
            <div class="type-label" id="right-label">Fraction</div>
            <div class="num-val" id="right-val">3</div>
          </div>
        </div>

        <div id="number-line-wrap"></div>
      </div>

      <div class="options" id="options" role="group" aria-label="Choose comparison symbol">
        <button class="option-btn" data-sym="lt" aria-label="Less than">
          &lt;
          <span class="btn-label">Less than</span>
        </button>
        <button class="option-btn" data-sym="eq" aria-label="Equal to">
          =
          <span class="btn-label">Equal</span>
        </button>
        <button class="option-btn" data-sym="gt" aria-label="Greater than">
          &gt;
          <span class="btn-label">Greater than</span>
        </button>
      </div>

      <div class="row" style="margin-top:0.75rem; justify-content:space-between;">
        <button class="ghost-btn no-print" id="read-btn">🔊 Read again (R)</button>
        <div class="row">
          <button class="secondary-btn no-print" id="skip-btn">Skip ↷</button>
          <button class="main-btn no-print" id="next-btn" disabled>Next ➜</button>
        </div>
      </div>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" class="card hidden" aria-label="Results">
      <h2 style="font-size:1.8rem; font-weight:800;">Trail Complete! 🎉</h2>
      <div id="appraise" style="font-size:1.1rem; font-weight:800; color:var(--muted); margin-top:0.25rem;"></div>
      <div id="score-big">0 / 0</div>
      <div style="font-weight:800; color:var(--muted)">Time taken: <span id="time-taken">00:00</span></div>
      <div class="badges" id="badges"></div>

      <div class="row" style="gap:0.5rem; margin:0.5rem 0">
        <button class="main-btn no-print" id="play-again">Play Again 🔄</button>
        <button class="secondary-btn no-print" id="print-btn">🖨️ Print / Save PDF</button>
      </div>

      <div id="summary-title" style="font-weight:800; margin-top:0.5rem">Questions Summary</div>
      <div id="review-list" class="review-list"></div>
    </section>
  </main>

  <!-- Common Footer Auto-Mounted -->
  <footer data-kz-footer></footer>
</body>
</html>
