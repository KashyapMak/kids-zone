<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>KLOTSKI — Kids Zone</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Baloo+2:wght@600;700;800&family=Orbitron:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* ── TRAIL-SERIES THEME TOKENS ── */
    :root {
      --primary: #059669;
      --bg:      #ecfdf5;
      --text:    #052e1c;
      --muted:   #475569;
      --prog:    #10b981;
      --accent:  #f59e0b;
      --card:    #ffffff;
      --danger:  #ef4444;
      --ok:      #16a34a;
      --shadow:  0 10px 25px rgba(0,0,0,.08);
      --radius:  20px;
      /* Klotski wood constants (always present) */
      --wood-light: #f5e6c8;
      --wood-mid:   #e8c98a;
      --wood-dark:  #c49a3c;
      --wood-grain: #d4b060;
      --tile-shine: rgba(255,255,255,.22);
      --shadow-wood: 0 8px 32px rgba(92,58,30,.18), 0 2px 8px rgba(92,58,30,.10);
      --shadow-tile: 0 4px 10px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);
      --radius-board: 20px;
      --radius-tile:  10px;
    }

    /* ── TRAIL THEMES (identical to Times Table Trail) ── */
    .theme-blue   { --primary:#2563eb; --bg:#eff6ff; --text:#0b1220; --prog:#22c55e; --accent:#f59e0b; --card:#ffffff; }
    .theme-pink   { --primary:#ec4899; --bg:#fdf2f8; --text:#831843; --prog:#db2777; --accent:#fbbf24; --card:#ffffff; }
    .theme-space  { --primary:#7c3aed; --bg:#0b1020; --text:#e5e7eb; --prog:#22d3ee; --accent:#fbbf24; --card:#141a2a; }
    .theme-jungle { --primary:#059669; --bg:#ecfdf5; --text:#052e1c; --prog:#10b981; --accent:#f59e0b; --card:#ffffff; }
    .theme-ocean  { --primary:#0ea5e9; --bg:#e0f2fe; --text:#06243b; --prog:#22c55e; --accent:#f97316; --card:#ffffff; }
    .theme-candy  { --primary:#f43f5e; --bg:#fff1f2; --text:#7f1d1d; --prog:#34d399; --accent:#fb7185; --card:#ffffff; }
    .high-contrast {
      --bg:#000; --text:#fff; --card:#111; --primary:#ffd000;
      --accent:#00ffff; --prog:#00ff66; --muted:#bbb;
      --shadow: 0 0 0 rgba(0,0,0,0);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Baloo 2', 'Fredoka', 'Comic Sans MS', system-ui, sans-serif;
      transition: background .3s, color .3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER — identical structure to Trail series ── */
    header {
      width: 100%;
      background: var(--card);
      position: sticky; top: 0; z-index: 50;
      border-bottom: 4px solid rgba(0,0,0,.05);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1rem;
    }
    #brand {
      display: flex; align-items: center; gap: .6rem; font-weight: 800;
    }
    #brand svg { width: 32px; height: 32px; flex-shrink: 0; }
    #brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 3px;
      margin: 0;
    }
    .header-center {
      display: flex; align-items: center; gap: .4rem; justify-content: center; flex-wrap: wrap;
    }
    .header-right {
      display: flex; align-items: center; gap: .4rem; justify-self: end;
    }
    /* Trail-series icon-btn — uses --primary */
    .icon-btn {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 999px;
      padding: .35rem .6rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--primary); color: #fff; }
    .icon-btn[aria-pressed="true"] { background: var(--primary); color: #fff; }
    /* Trail-series select */
    .select, select {
      font-family: inherit; font-weight: 700; color: var(--text);
      border-radius: 12px; border: 2px solid var(--primary);
      background: var(--card); padding: .45rem .65rem; outline: none;
      cursor: pointer;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 1rem 2rem;
      gap: 1rem;
      width: 100%;
    }

    /* ── MODE PICKER ── */
    .mode-row {
      display: flex; gap: .55rem; flex-wrap: wrap; justify-content: center;
    }
    .mode-btn {
      padding: .6rem 1.3rem;
      border-radius: 14px;
      border: 3px solid var(--primary);
      background: var(--card);
      color: var(--text);
      font-weight: 800;
      font-family: 'Baloo 2', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary), 0 6px 12px rgba(0,0,0,.1);
      transition: transform .1s, box-shadow .1s;
      letter-spacing: .3px;
    }
    .mode-btn:hover { transform: translateY(-2px); }
    .mode-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary); }
    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 0 color-mix(in srgb, var(--primary) 60%, #000), 0 6px 16px rgba(0,0,0,.15);
    }

    /* ── SCOREBAR ── */
    .scorebar {
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
      align-items: center;
    }
    .stat-chip {
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      padding: .35rem .85rem;
      font-weight: 800;
      font-size: .95rem;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: .35rem;
    }
    .stat-chip span.val {
      font-family: 'Orbitron', monospace;
      font-size: 1.05rem;
      color: #fff;
    }
    .stat-chip.timer-urgent span.val { color: #ffdd88; }

    /* ── BOARD WRAPPER ── */
    .board-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* Board frame uses --primary tint + wood constants */
    .board-frame {
      background: linear-gradient(145deg,
        color-mix(in srgb, var(--primary) 80%, #2a1a0a),
        color-mix(in srgb, var(--primary) 55%, #1a0f05) 50%,
        color-mix(in srgb, var(--primary) 70%, #2a1a0a));
      border-radius: var(--radius-board);
      padding: 10px;
      box-shadow: var(--shadow-wood),
                  inset 0 2px 4px rgba(255,255,255,.08),
                  inset 0 -2px 4px rgba(0,0,0,.2);
      position: relative;
    }
    /* Inner board surface */
    .board {
      background: rgba(0,0,0,.55);
      border-radius: 12px;
      display: grid;
      gap: 4px;
      padding: 4px;
      position: relative;
    }

    /* ── TILES ── */
    .tile {
      border-radius: var(--radius-tile);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      user-select: none;
      position: relative;
      overflow: hidden;
      transition: transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s;
      /* background and font-size set by JS based on grid size */
    }
    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--tile-shine) 0%, transparent 55%);
      border-radius: inherit;
      pointer-events: none;
    }
    .tile::after {
      content: '';
      position: absolute;
      top: 2px; left: 4px; right: 4px;
      height: 2px;
      background: rgba(255,255,255,.3);
      border-radius: 2px;
      pointer-events: none;
    }
    /* Engraved border on tile */
    .tile .tile-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 78%;
      height: 78%;
      border: 2px solid rgba(0,0,0,.25);
      border-radius: 6px;
      background: rgba(0,0,0,.08);
    }
    .tile:hover { transform: scale(1.04); }
    .tile:active { transform: scale(.96); }
    .tile.slideable { cursor: pointer; }
    .tile.not-slideable { cursor: default; }
    .tile.not-slideable:hover { transform: none; }

    /* Tile slide animation */
    .tile.slide-anim {
      transition: transform .13s cubic-bezier(.34,1.3,.64,1), box-shadow .13s;
    }

    /* Empty cell */
    .tile-empty {
      border-radius: var(--radius-tile);
      background: rgba(0,0,0,.6);
      box-shadow: inset 0 3px 10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
    }

    /* ── WIN OVERLAY ── */
    .win-overlay {
      position: absolute;
      inset: 0;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      z-index: 20;
      backdrop-filter: blur(3px);
      animation: fadeIn .4s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
    .win-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      color: var(--text);
      text-align: center;
    }
    .win-stats {
      font-weight: 800;
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
      line-height: 1.6;
    }
    .win-btn {
      padding: .7rem 1.8rem;
      border-radius: 14px;
      border: 3px solid var(--primary);
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 5px 0 color-mix(in srgb, var(--primary) 60%, #000), 0 8px 20px rgba(0,0,0,.15);
      transition: transform .1s;
      margin-top: .2rem;
    }
    .win-btn:hover { transform: translateY(-2px); }

    /* ── ACTION BUTTONS ── */
    .action-row {
      display: flex; gap: .55rem; flex-wrap: wrap; justify-content: center;
    }
    .act-btn {
      padding: .6rem 1.1rem;
      border-radius: 12px;
      border: 2.5px solid var(--primary);
      background: var(--card);
      color: var(--text);
      font-weight: 800;
      font-family: inherit;
      font-size: .95rem;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--primary), 0 5px 12px rgba(0,0,0,.08);
      transition: transform .1s, box-shadow .1s;
    }
    .act-btn:hover { transform: translateY(-2px); }
    .act-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary); }
    .act-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 3px 0 color-mix(in srgb, var(--primary) 60%, #000), 0 5px 12px rgba(0,0,0,.12);
    }

    /* ── HOW TO PLAY ── */
    .how-to {
      max-width: 520px;
      background: color-mix(in srgb, var(--primary) 8%, transparent);
      border: 2px dashed color-mix(in srgb, var(--primary) 40%, transparent);
      border-radius: 14px;
      padding: .75rem 1rem;
      font-size: .88rem;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .how-to strong { color: var(--text); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 10px;
      font-size: .88rem;
      color: var(--muted);
      font-weight: 700;
    }
    .footer-row { display:flex; gap:.6rem; align-items:center; justify-content:center; flex-wrap:wrap; }
    .footer-sep { opacity:.35; }
    .social-link { display:inline-flex; align-items:center; gap:.35rem; color:var(--primary); text-decoration:none; font-weight:800; }
    .social-link:hover { text-decoration:underline; }
    .ico { width:16px; height:16px; }

    /* ── UTILS ── */
    .hidden { display: none !important; }
    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0; }
    @media (max-width: 480px) {
      #brand h1 { font-size: 1.05rem; }
    }
  </style>
</head>

<script>
  /* =============================================
     CONFIG
     ============================================= */
  const MODES = {
    simple: { n: 4,  label: 'Simple (4×4)',  shuffles: 80  },
    medium: { n: 8,  label: 'Medium (8×8)',  shuffles: 200 },
    hard:   { n: 12, label: 'Hard (12×12)', shuffles: 350 }
  };

  let mode = 'simple';
  let N = 4;
  let tiles = [];        // 1D array, 0 = empty
  let initTiles = [];    // snapshot for reset
  let emptyIdx = 0;
  let moves = 0;
  let timerSec = 0;
  let timerObj = null;
  let gameActive = false;
  let isMuted = false;
  let hintTimeout = null;

  const $ = id => document.getElementById(id);

  /* =============================================
     AUDIO
     ============================================= */
  function beep(type='slide') {
    if (isMuted) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      if (type === 'slide') {
        o.type = 'sine';
        o.frequency.setValueAtTime(520, ctx.currentTime);
        o.frequency.linearRampToValueAtTime(420, ctx.currentTime + 0.07);
        g.gain.value = 0.0001;
        g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
        o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.09); o.stop(ctx.currentTime + 0.1);
      } else if (type === 'win') {
        [523, 659, 784, 1047].forEach((f, i) => {
          const ow = ctx.createOscillator(), gw = ctx.createGain();
          ow.connect(gw); gw.connect(ctx.destination);
          ow.type = 'sine'; ow.frequency.value = f;
          gw.gain.value = 0.0001;
          const t = ctx.currentTime + i * 0.12;
          gw.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
          ow.start(t); gw.gain.exponentialRampToValueAtTime(0.0001, t + 0.18); ow.stop(t + 0.2);
        });
      } else if (type === 'hint') {
        o.type = 'triangle'; o.frequency.value = 880;
        g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.01);
        o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12); o.stop(ctx.currentTime + 0.13);
      }
    } catch {}
  }

  /* =============================================
     MODE & SIZING
     ============================================= */
  function selectMode(m, btn) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    newGame();
  }

  function tileSize() {
    // Compute tile px based on viewport and N
    const maxBoard = Math.min(window.innerWidth - 48, window.innerHeight - 260, 580);
    const gap = 4;
    const pad = 4 * 2;
    const frame = 10 * 2;
    const available = maxBoard - pad - frame - gap * (N - 1);
    return Math.floor(available / N);
  }

  function fontSize(ts) {
    if (N <= 4)  return Math.round(ts * 0.42);
    if (N <= 8)  return Math.round(ts * 0.38);
    return Math.round(ts * 0.33);
  }

  /* =============================================
     PUZZLE LOGIC
     ============================================= */
  function goalState() {
    const g = [];
    for (let i = 1; i < N*N; i++) g.push(i);
    g.push(0);
    return g;
  }

  function isSolved() {
    const goal = goalState();
    return tiles.every((v, i) => v === goal[i]);
  }

  // Check if a random shuffle is solvable (for 4×4 sliding puzzle)
  // For larger grids we just do random adjacent swaps from goal state
  function shufflePuzzle() {
    // Start from solved state and make random valid moves
    tiles = goalState();
    emptyIdx = N * N - 1;
    const steps = MODES[mode].shuffles;
    let lastEmpty = -1;
    for (let i = 0; i < steps; i++) {
      const neighbors = getMoveable(emptyIdx).filter(idx => idx !== lastEmpty);
      const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
      if (pick === undefined) continue;
      lastEmpty = emptyIdx;
      tiles[emptyIdx] = tiles[pick];
      tiles[pick] = 0;
      emptyIdx = pick;
    }
  }

  function getMoveable(eIdx) {
    const row = Math.floor(eIdx / N), col = eIdx % N;
    const neighbors = [];
    if (row > 0)     neighbors.push(eIdx - N);  // tile above can slide down
    if (row < N-1)   neighbors.push(eIdx + N);  // tile below can slide up
    if (col > 0)     neighbors.push(eIdx - 1);  // tile left can slide right
    if (col < N-1)   neighbors.push(eIdx + 1);  // tile right can slide left
    return neighbors;
  }

  function canSlide(idx) {
    return getMoveable(emptyIdx).includes(idx);
  }

  function slideTile(idx) {
    if (!gameActive || !canSlide(idx)) return;
    // Start timer on first move
    if (moves === 0) startTimer();

    // Swap
    tiles[emptyIdx] = tiles[idx];
    tiles[idx] = 0;
    emptyIdx = idx;
    moves++;
    $('move-count').textContent = moves;
    beep('slide');
    renderBoard(true);

    if (isSolved()) {
      gameActive = false;
      clearInterval(timerObj);
      setTimeout(showWin, 300);
    }
  }

  /* =============================================
     TIMER
     ============================================= */
  function startTimer() {
    clearInterval(timerObj);
    timerObj = setInterval(() => {
      timerSec++;
      $('timer-disp').textContent = fmtTime(timerSec);
      if (timerSec >= 600) $('timer-chip').classList.add('timer-urgent');
    }, 1000);
  }
  function fmtTime(s) {
    const m = Math.floor(s/60), sec = s%60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  /* =============================================
     BEST SCORE
     ============================================= */
  function getBest(m) {
    try { return JSON.parse(localStorage.getItem('klotski_best_'+m)||'null'); } catch { return null; }
  }
  function setBest(m, data) {
    try { localStorage.setItem('klotski_best_'+m, JSON.stringify(data)); } catch {}
  }
  function updateBestDisplay() {
    const best = getBest(mode);
    $('best-disp').textContent = best ? `${best.moves}mv ${fmtTime(best.time)}` : '—';
  }

  /* =============================================
     WIN
     ============================================= */
  function showWin() {
    beep('win');
    confetti({ particleCount: 200, spread: 80, origin: { y: 0.5 } });

    const best = getBest(mode);
    if (!best || moves < best.moves || (moves === best.moves && timerSec < best.time)) {
      setBest(mode, { moves, time: timerSec });
    }
    updateBestDisplay();

    $('win-title').textContent = moves < 30 ? '🏆 Masterful!' : moves < 80 ? '🎉 Solved!' : '💪 You did it!';
    $('win-stats').innerHTML = `Mode: <strong>${MODES[mode].label}</strong><br>Moves: <strong>${moves}</strong> &nbsp;|&nbsp; Time: <strong>${fmtTime(timerSec)}</strong>`;
    $('win-overlay').classList.remove('hidden');
  }

  /* =============================================
     HINT
     ============================================= */
  function solveHint() {
    // Just highlight moveable tiles briefly
    beep('hint');
    const board = $('board');
    const moveables = getMoveable(emptyIdx);
    board.querySelectorAll('.tile').forEach(el => {
      const idx = parseInt(el.dataset.idx);
      if (moveables.includes(idx)) {
        el.style.boxShadow = '0 0 0 3px #ffd700, 0 0 18px #ffd700';
        setTimeout(() => { el.style.boxShadow = ''; }, 1000);
      }
    });
  }

  /* =============================================
     RENDER
     ============================================= */
  function renderBoard(animate = false) {
    N = MODES[mode].n;
    const board = $('board');
    const ts = tileSize();
    const boardPx = ts * N + 4 * (N - 1) + 8;

    board.style.gridTemplateColumns = `repeat(${N}, ${ts}px)`;
    board.style.gridTemplateRows    = `repeat(${N}, ${ts}px)`;
    board.style.width  = boardPx + 'px';
    board.style.height = boardPx + 'px';

    // Build or update tiles
    const existing = board.querySelectorAll('.tile, .tile-empty');
    const total = N * N;

    // Always rebuild for simplicity — fast enough for all grid sizes
    board.innerHTML = '';

    for (let i = 0; i < total; i++) {
      const val = tiles[i];

      if (val === 0) {
        const empty = document.createElement('div');
        empty.className = 'tile-empty';
        empty.style.width = ts + 'px';
        empty.style.height = ts + 'px';
        board.appendChild(empty);
        continue;
      }

      const el = document.createElement('div');
      el.className = 'tile';
      el.dataset.idx = i;
      el.dataset.val = val;
      el.style.width = ts + 'px';
      el.style.height = ts + 'px';
      el.style.fontSize = fontSize(ts) + 'px';

      // Color: use primary hue with slight variation per tile for visual richness
      const primaryRgb = getComputedStyle(document.body).getPropertyValue('--primary').trim();
      // Parse hue from primary or fall back to blue-ish
      let baseHue = 200;
      try {
        const tmp = document.createElement('div');
        tmp.style.color = primaryRgb;
        document.body.appendChild(tmp);
        const rgb = getComputedStyle(tmp).color;
        document.body.removeChild(tmp);
        const m = rgb.match(/\d+/g);
        if (m) {
          const r=+m[0]/255, g=+m[1]/255, b=+m[2]/255;
          const max=Math.max(r,g,b), min=Math.min(r,g,b);
          if (max!==min) {
            if (max===r) baseHue=60*((g-b)/(max-min));
            else if (max===g) baseHue=60*(2+(b-r)/(max-min));
            else baseHue=60*(4+(r-g)/(max-min));
            if (baseHue<0) baseHue+=360;
          }
        }
      } catch {}
      const hue = baseHue + ((val * 7) % 30) - 15;
      const sat = 58 + ((val * 3) % 12);
      const lit = 48 + ((val * 5) % 12) - 6;
      el.style.background = `linear-gradient(135deg,
        hsl(${hue},${sat}%,${lit+8}%) 0%,
        hsl(${hue},${sat}%,${lit}%) 50%,
        hsl(${hue},${sat}%,${lit-8}%) 100%)`;
      el.style.boxShadow = `var(--shadow-tile)`;
      const slideable = canSlide(i);
      el.classList.toggle('slideable', slideable);
      el.classList.toggle('not-slideable', !slideable);

      // Inner engraved border
      const inner = document.createElement('div');
      inner.className = 'tile-inner';
      inner.textContent = val;

      inner.style.borderColor = `hsl(${hue},${sat}%,${lit-22}%)`;
      // Hide inner border for very small tiles (hard mode)
      if (ts < 36) { inner.style.border = 'none'; inner.style.background = 'transparent'; }

      el.appendChild(inner);
      el.addEventListener('click', () => slideTile(parseInt(el.dataset.idx)));

      if (animate && slideable) {
        el.style.transition = 'transform .12s cubic-bezier(.34,1.3,.64,1)';
      }

      board.appendChild(el);
    }
  }

  /* =============================================
     GAME CONTROL
     ============================================= */
  function newGame() {
    N = MODES[mode].n;
    $('win-overlay').classList.add('hidden');
    clearInterval(timerObj);
    moves = 0; timerSec = 0;
    $('move-count').textContent = '0';
    $('timer-disp').textContent = '00:00';
    $('timer-chip').classList.remove('timer-urgent');
    shufflePuzzle();
    initTiles = [...tiles];
    gameActive = true;
    updateBestDisplay();
    renderBoard(false);
  }

  function resetBoard() {
    if (!gameActive && !$('win-overlay').classList.contains('hidden')) return;
    $('win-overlay').classList.add('hidden');
    clearInterval(timerObj);
    tiles = [...initTiles];
    emptyIdx = tiles.indexOf(0);
    moves = 0; timerSec = 0;
    $('move-count').textContent = '0';
    $('timer-disp').textContent = '00:00';
    $('timer-chip').classList.remove('timer-urgent');
    gameActive = true;
    renderBoard(false);
  }

  /* =============================================
     KEYBOARD
     ============================================= */
  document.addEventListener('keydown', e => {
    if (!gameActive) return;
    const row = Math.floor(emptyIdx / N), col = emptyIdx % N;
    let target = -1;
    if (e.key === 'ArrowUp'    && row < N-1) target = emptyIdx + N;
    if (e.key === 'ArrowDown'  && row > 0)   target = emptyIdx - N;
    if (e.key === 'ArrowLeft'  && col < N-1) target = emptyIdx + 1;
    if (e.key === 'ArrowRight' && col > 0)   target = emptyIdx - 1;
    if (target >= 0) { e.preventDefault(); slideTile(target); }
    if (e.key.toLowerCase() === 'h') solveHint();
    if (e.key.toLowerCase() === 'r') resetBoard();
    if (e.key.toLowerCase() === 'n') newGame();
  });

  /* =============================================
     THEME
     ============================================= */
  function setTheme(t) {
    // Remove all theme classes but keep high-contrast if active
    const hc = document.body.classList.contains('high-contrast');
    document.body.className = t + (hc ? ' high-contrast' : '');
  }

  $('theme').addEventListener('change', e => setTheme(e.target.value));

  $('contrast-btn').addEventListener('click', e => {
    const on = !document.body.classList.contains('high-contrast');
    // Keep current theme class
    const currentTheme = $('theme').value;
    document.body.className = currentTheme + (on ? ' high-contrast' : '');
    e.currentTarget.setAttribute('aria-pressed', String(on));
  });

  /* =============================================
     SOUND & HELP
     ============================================= */
  $('sound-btn').addEventListener('click', e => {
    isMuted = !isMuted;
    e.currentTarget.setAttribute('aria-pressed', String(!isMuted));
    e.currentTarget.textContent = isMuted ? '🔇' : '🔊';
    if (!isMuted) beep('slide');
  });

  $('help-btn').addEventListener('click', () => {
    alert(
`KLOTSKI — Sliding Tile Puzzle

Goal: Arrange tiles 1→N in order,
      empty space at bottom-right.

How to play:
• Click / tap a tile next to the empty space to slide it
• Use Arrow Keys to slide (arrow points to empty space direction)

Shortcuts:
• Arrow Keys → slide tiles
• H → highlight moveable tiles (hint)
• R → reset to start position
• N → new shuffle

Modes:
• Simple  → 4×4  grid (15 tiles)
• Medium  → 8×8  grid (63 tiles)
• Hard    → 12×12 grid (143 tiles)

Tip: Watch the move counter — fewer moves is better!`
    );
  });

  /* =============================================
     RESIZE
     ============================================= */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderBoard(false), 120);
  });

  /* =============================================
     INIT
     ============================================= */
  setTheme('theme-jungle');
  newGame();
</script>
</body>
</html>
